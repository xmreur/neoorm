name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neoorm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neoorm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: neoorm
          MYSQL_DATABASE: neoorm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pneoorm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: neoorm
          MARIADB_DATABASE: neoorm_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -pneoorm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/neoorm_test
      MYSQL_URL: mysql://root:neoorm@127.0.0.1:3306/neoorm_test
      MARIADB_URL: mariadb://root:neoorm@127.0.0.1:3307/neoorm_test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('./package.json').text()).version)")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v${TAG} does not match package.json version ${VERSION}"
            exit 1
          fi

      - run: bun run lint
      - run: bun run build
      - run: bun run dist/bin/neoorm.js generate
      - run: bun run typecheck
      - run: bun run test

      # Trusted Publisher requires npm >= 11.5.1 and must NOT use NODE_AUTH_TOKEN
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --access public --provenance